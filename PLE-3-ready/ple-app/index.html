<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2F6BFF" />
<title>Smart PLE — Practice App (UI Prototype)</title>
<style>
/* ============================================================
   SMART PLE · UI/UX PROTOTYPE
   Upper Primary (P4–P7) PLE Practice App
   No academic content — placeholders only.
   ============================================================ */

/* ---------- 1. DESIGN TOKENS ---------- */
:root{
  --blue:#2F6BFF;   --blue-dark:#1E4FD8;  --blue-soft:#E8EFFF;
  --green:#12A05C;  --green-soft:#E1F7EC;
  --amber:#F59E0B;  --amber-soft:#FEF3DC;
  --violet:#7C5CFF; --violet-soft:#EEEAFF;
  --pink:#EC4899;   --pink-soft:#FDE9F3;
  --red:#E5484D;    --red-soft:#FDECEC;

  --ink:#111F3A;    --ink-2:#3C4C68;   --muted:#6B7B95;
  --line:#E4E9F2;
  --bg:#F4F7FC;     --card:#FFFFFF;

  --r-sm:14px; --r-md:20px; --r-lg:26px; --r-xl:32px;
  --pad:18px;
  --tap:60px;                       /* minimum touch target */
  --sh-1:0 2px 8px rgba(17,31,58,.06);
  --sh-2:0 6px 18px rgba(17,31,58,.09);
  --sh-3:0 14px 34px rgba(17,31,58,.14);
  --nav-h:76px;
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  background:var(--bg); font-size:17px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}

/* ---------- 2. APP SHELL / RESPONSIVE FRAME ---------- */
#app{
  position:relative; width:100%; max-width:480px; margin:0 auto;
  min-height:100dvh; background:var(--bg); overflow:hidden;
  display:flex; flex-direction:column;
}
.screen{
  display:none; flex-direction:column; flex:1;
  padding:0 var(--pad) calc(var(--nav-h) + 26px);
  animation:screenIn .26s var(--ease);
}
.screen.active{display:flex}
.screen.no-nav{padding-bottom:26px}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Tablet */
@media (min-width:760px){
  :root{--pad:26px;}
  #app{max-width:760px}
  body{font-size:18px}
}
/* Desktop: float the app like a device */
@media (min-width:1024px){
  body{
    background:
      radial-gradient(1100px 520px at 12% -8%, #E7EEFF 0%, transparent 60%),
      radial-gradient(900px 480px at 92% 108%, #EAF7F0 0%, transparent 60%),
      #EEF2F9;
    padding:26px 0;
  }
  #app{
    max-width:820px; min-height:calc(100dvh - 52px); height:calc(100dvh - 52px);
    border-radius:var(--r-xl); box-shadow:var(--sh-3); overflow:hidden;
  }
  .screen{overflow-y:auto}
}

/* ---------- 3. TOP BARS ---------- */
.appbar{
  display:flex; align-items:center; gap:12px;
  padding:16px 0 10px; position:sticky; top:0; z-index:20;
  background:linear-gradient(var(--bg) 78%, rgba(244,247,252,0));
}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.logo{
  width:44px;height:44px;border-radius:14px;flex:none;
  background:linear-gradient(145deg,var(--blue),#5B8BFF);
  display:grid;place-items:center;box-shadow:0 6px 14px rgba(47,107,255,.32);
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand-sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:-2px}

.avatar{
  width:var(--tap);height:52px;min-width:52px;border-radius:50%;
  background:var(--amber-soft); border:2.5px solid #fff; box-shadow:var(--sh-1);
  display:grid;place-items:center; font-size:26px; width:52px;
  transition:transform .15s var(--ease);
}
.avatar:active{transform:scale(.93)}

/* Sub-page header with back button */
.pagehead{
  display:flex;align-items:center;gap:12px;
  padding:14px 0 6px; position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 78%, rgba(244,247,252,0));
}
.back{
  width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:var(--sh-1);
  display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),background .15s;
}
.back:active{transform:scale(.9);background:var(--blue-soft)}
.pagehead h2{font-size:22px;font-weight:800;flex:1;min-width:0}
.pagehead .sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}

.section-title{font-size:15px;font-weight:800;color:var(--ink-2);letter-spacing:.02em;margin:22px 2px 12px;text-transform:uppercase;font-size:13.5px}

/* ---------- 4. BUTTONS ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:var(--tap); width:100%; padding:0 22px;
  border-radius:var(--r-md); font-weight:800; font-size:18px;
  transition:transform .12s var(--ease), box-shadow .2s, filter .2s;
}
.btn:active{transform:scale(.965)}
.btn-primary{background:linear-gradient(145deg,var(--blue),#4C82FF);color:#fff;box-shadow:0 8px 18px rgba(47,107,255,.34)}
.btn-primary:active{box-shadow:0 4px 10px rgba(47,107,255,.3)}
.btn-green{background:linear-gradient(145deg,var(--green),#22B96E);color:#fff;box-shadow:0 8px 18px rgba(18,160,92,.3)}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:var(--sh-1);border:1.5px solid var(--line)}
.btn-soft{background:var(--blue-soft);color:var(--blue-dark)}
.btn-lg{min-height:66px;font-size:19px;border-radius:var(--r-lg)}
.btn-row{display:flex;gap:12px}
.btn-row .btn{flex:1}

/* ---------- 5. CARDS ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:18px}

/* Continue card */
.continue-card{
  position:relative; overflow:hidden; color:#fff; padding:20px;
  border-radius:var(--r-xl);
  background:linear-gradient(140deg,#2F6BFF 0%,#5A5CFF 55%,#7C5CFF 100%);
  box-shadow:0 14px 30px rgba(47,107,255,.32);
}
.continue-card::after{
  content:"";position:absolute;right:-46px;top:-56px;width:190px;height:190px;
  border-radius:50%;background:rgba(255,255,255,.13)
}
.continue-card::before{
  content:"";position:absolute;right:24px;bottom:-64px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.10)
}
.cc-tag{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;
  background:rgba(255,255,255,.2);padding:7px 12px;border-radius:999px;letter-spacing:.02em
}
.cc-title{font-size:23px;font-weight:800;margin:12px 0 3px;position:relative}
.cc-sub{font-size:14.5px;opacity:.92;font-weight:600;position:relative}
.cc-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.28);margin:16px 0 8px;overflow:hidden;position:relative}
.cc-bar i{display:block;height:100%;border-radius:99px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6);transition:width .9s var(--ease)}
.cc-meta{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;opacity:.95;position:relative}
.cc-btn{
  position:relative;margin-top:16px;background:#fff;color:var(--blue-dark);
  min-height:62px;border-radius:var(--r-lg);font-size:19px;font-weight:900;letter-spacing:.03em;
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  box-shadow:0 8px 16px rgba(9,20,50,.18); transition:transform .12s var(--ease)
}
.cc-btn:active{transform:scale(.965)}

/* Big navigation tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{
  background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:17px 15px 16px;text-align:left;min-height:132px;
  display:flex;flex-direction:column;gap:10px;justify-content:flex-start;
  transition:transform .14s var(--ease),box-shadow .2s;
}
.tile:active{transform:scale(.96);box-shadow:var(--sh-2)}
.tile .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none}
.tile b{font-size:17.5px;font-weight:800;display:block}
.tile span{font-size:13px;color:var(--muted);font-weight:600;line-height:1.3}

/* List rows (modes / subjects / topics / papers) */
.rows{display:flex;flex-direction:column;gap:13px}
.row{
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:16px;min-height:var(--tap);
  transition:transform .14s var(--ease),box-shadow .2s;
}
.row:active{transform:scale(.975);box-shadow:var(--sh-2)}
.row .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:18px;font-weight:800}
.row .txt span{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.chev{flex:none;color:#B6C1D4}

/* Subject grid */
.grid-sub{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media (min-width:760px){.grid-sub{grid-template-columns:repeat(3,1fr)}}
.subject{
  background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;
  min-height:152px;justify-content:center;
  transition:transform .14s var(--ease),box-shadow .2s;
}
.subject:active{transform:scale(.95);box-shadow:var(--sh-2)}
.subject .ic{width:66px;height:66px;border-radius:22px;display:grid;place-items:center}
.subject b{font-size:17px;font-weight:800;text-align:center}
.subject span{font-size:12.5px;color:var(--muted);font-weight:700}

/* Topic card */
.topic{
  display:block;width:100%;text-align:left;background:#fff;
  border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px 17px;
  transition:transform .14s var(--ease),box-shadow .2s;
}
.topic:active{transform:scale(.98)}
.topic .t-top{display:flex;align-items:center;gap:12px}
.topic b{flex:1;font-size:17px;font-weight:800}
.topic .pct{font-size:14px;font-weight:900;color:var(--blue)}
.bar{height:11px;border-radius:99px;background:#EDF1F8;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#6E9BFF);transition:width .8s var(--ease)}
.bar.green i{background:linear-gradient(90deg,var(--green),#3BCC85)}
.t-meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:700}

/* Pills / badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800}
.pill.off{background:var(--green-soft);color:#0B7A44}
.pill.dl{background:var(--blue-soft);color:var(--blue-dark)}
.pill.no{background:#F0F3F8;color:var(--muted)}
.pill.time{background:var(--amber-soft);color:#96650A}

/* ---------- 6. QUESTION SCREEN ---------- */
.qbar{
  position:sticky;top:0;z-index:20;padding:14px 0 12px;
  background:linear-gradient(var(--bg) 80%,rgba(244,247,252,0));
}
.qbar-top{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.qcount{font-size:16px;font-weight:800;flex:1}
.qcount em{font-style:normal;color:var(--muted);font-weight:700}
.timer{
  display:inline-flex;align-items:center;gap:7px;background:#fff;box-shadow:var(--sh-1);
  padding:8px 13px;border-radius:999px;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums
}
.timer.warn{background:var(--red-soft);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qprog{height:14px;border-radius:99px;background:#E6EBF4;overflow:hidden}
.qprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#7C5CFF);transition:width .45s var(--ease)}

.qcard{
  background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-2);
  padding:24px 20px;margin:6px 0 20px;min-height:150px;
  display:flex;flex-direction:column;justify-content:center;gap:14px;
  animation:qIn .3s var(--ease);
}
@keyframes qIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.qtag{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.qtext{font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.qhint{font-size:13.5px;color:var(--muted);font-weight:600}

.answers{display:flex;flex-direction:column;gap:12px}
.ans{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  min-height:68px;padding:14px 16px;border-radius:var(--r-lg);
  background:#fff;box-shadow:var(--sh-1);border:2.5px solid transparent;
  font-size:17.5px;font-weight:700;
  transition:transform .12s var(--ease),border-color .18s,background .18s,box-shadow .2s;
}
.ans:active{transform:scale(.98)}
.ans .let{
  width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:var(--blue-soft);color:var(--blue-dark);font-weight:900;font-size:18px;
  transition:background .18s,color .18s;
}
.ans .lab{flex:1}
.ans .mark{width:30px;flex:none;display:grid;place-items:center;opacity:0;transform:scale(.5);transition:.22s var(--ease)}
.ans.correct{border-color:var(--green);background:var(--green-soft)}
.ans.correct .let{background:var(--green);color:#fff}
.ans.correct .mark{opacity:1;transform:none;color:var(--green)}
.ans.wrong{border-color:var(--amber);background:var(--amber-soft)}
.ans.wrong .let{background:var(--amber);color:#fff}
.ans.wrong .mark{opacity:1;transform:none;color:#B5750A}
.ans.picked{border-color:var(--blue);background:var(--blue-soft)}
.ans.picked .let{background:var(--blue);color:#fff}
.ans.dim{opacity:.5}
.ans[disabled]{cursor:default}
@keyframes popIn{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.ans.bump{animation:popIn .38s var(--ease)}
@keyframes shakeSoft{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ans.nudge{animation:shakeSoft .3s ease}

/* Feedback bar */
.feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:480px;margin:0 auto;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));
  background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:0 -10px 30px rgba(17,31,58,.14);
  transform:translateY(115%);transition:transform .32s var(--ease);
  display:flex;align-items:center;gap:14px;
}
.feedback.show{transform:none}
@media (min-width:760px){.feedback{max-width:760px}}
@media (min-width:1024px){
  .feedback{position:absolute;max-width:820px;border-radius:var(--r-xl) var(--r-xl) 0 0}
}
.fb-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:28px}
.fb-txt{flex:1;min-width:0}
.fb-txt b{display:block;font-size:19px;font-weight:900}
.fb-txt span{font-size:13.5px;color:var(--muted);font-weight:600}
.fb-next{
  min-height:56px;padding:0 24px;border-radius:var(--r-md);font-weight:900;font-size:17px;
  background:linear-gradient(145deg,var(--blue),#4C82FF);color:#fff;flex:none;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 14px rgba(47,107,255,.32);
  transition:transform .12s var(--ease);
}
.fb-next:active{transform:scale(.95)}
.feedback.good .fb-ic{background:var(--green-soft);color:var(--green)}
.feedback.good .fb-txt b{color:#0B7A44}
.feedback.soft .fb-ic{background:var(--amber-soft)}
.feedback.soft .fb-txt b{color:#96650A}
.ring{position:absolute;inset:-4px;border-radius:inherit;border:3px solid rgba(47,107,255,.35);animation:ringOut 1.5s linear forwards}
@keyframes ringOut{to{opacity:0;transform:scale(1.08)}}

/* ---------- 7. RESULTS ---------- */
.result-hero{
  text-align:center;padding:26px 18px 22px;border-radius:var(--r-xl);color:#fff;
  background:linear-gradient(150deg,#12A05C,#2FBF7C 60%,#43D18C);
  box-shadow:0 14px 30px rgba(18,160,92,.3);position:relative;overflow:hidden;
}
.result-hero.mid{background:linear-gradient(150deg,#2F6BFF,#6A8DFF);box-shadow:0 14px 30px rgba(47,107,255,.3)}
.result-hero.low{background:linear-gradient(150deg,#F59E0B,#FFB93F);box-shadow:0 14px 30px rgba(245,158,11,.3)}
.rh-emoji{font-size:52px;line-height:1;animation:bounceIn .6s var(--ease)}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.rh-title{font-size:27px;font-weight:900;margin-top:8px}
.rh-sub{font-size:14.5px;opacity:.94;font-weight:600;margin-top:3px}
.score-label{font-size:12.5px;font-weight:900;letter-spacing:.16em;opacity:.9;margin-top:20px}
.score-big{font-size:66px;font-weight:900;line-height:1;letter-spacing:-.04em;margin-top:4px;font-variant-numeric:tabular-nums}
.score-frac{font-size:22px;font-weight:800;opacity:.95;margin-top:6px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:15px;display:flex;align-items:center;gap:12px}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}

/* Confetti */
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti-bit{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall linear forwards}
@keyframes fall{0%{opacity:1;transform:translateY(-30px) rotate(0)}100%{opacity:0;transform:translateY(320px) rotate(540deg)}}

/* ---------- 8. PROGRESS ---------- */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:126px;height:126px;flex:none;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .val b{font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.donut .val span{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.legend{display:flex;flex-direction:column;gap:10px;flex:1}
.legend div{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700}
.dot{width:12px;height:12px;border-radius:4px;flex:none}

.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:760px){.mini-grid{grid-template-columns:repeat(4,1fr)}}
.mini{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:16px}
.mini .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:10px}
.mini b{display:block;font-size:25px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.mini span{font-size:13px;color:var(--muted);font-weight:700}

.chart{display:flex;align-items:flex-end;gap:9px;height:132px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart .colbar{width:100%;max-width:34px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#6E9BFF,var(--blue));animation:growUp .7s var(--ease) both}
.chart .col.best .colbar{background:linear-gradient(180deg,#3BCC85,var(--green))}
.chart .col small{font-size:11.5px;color:var(--muted);font-weight:800}
@keyframes growUp{from{height:0!important;opacity:.3}}

.activity{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1.5px solid var(--line)}
.activity:last-child{border-bottom:0}
.activity .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.activity .txt{flex:1;min-width:0}
.activity .txt b{display:block;font-size:16px;font-weight:800}
.activity .txt span{font-size:12.5px;color:var(--muted);font-weight:600}
.activity .sc{font-size:16px;font-weight:900;color:var(--green)}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.badge{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-1);padding:13px 6px;text-align:center}
.badge .em{font-size:27px;line-height:1.1}
.badge small{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-top:5px}
.badge.locked{opacity:.45;filter:grayscale(1)}

/* ---------- 9. PROFILE ---------- */
.profile-hero{
  background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-1);
  padding:24px 18px;text-align:center;position:relative;
}
.big-avatar{
  width:98px;height:98px;border-radius:50%;margin:0 auto;display:grid;place-items:center;
  font-size:52px;background:var(--amber-soft);box-shadow:inset 0 0 0 4px #fff,0 8px 18px rgba(17,31,58,.12);
}
.p-name{font-size:24px;font-weight:900;margin-top:13px}
.p-class{display:inline-flex;align-items:center;gap:7px;margin-top:8px;background:var(--violet-soft);color:#5B3FE0;padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:800}
.p-stats{display:flex;margin-top:20px;border-top:1.5px solid var(--line);padding-top:16px}
.p-stats div{flex:1;text-align:center;position:relative}
.p-stats div+div::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.p-stats b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.p-stats span{font-size:12px;color:var(--muted);font-weight:700}

.menu{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.menu-item{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 17px;min-height:var(--tap);border-bottom:1.5px solid var(--line);
  transition:background .15s;
}
.menu-item:last-child{border-bottom:0}
.menu-item:active{background:#F6F8FC}
.menu-item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.menu-item b{flex:1;font-size:17px;font-weight:700}

/* Toggle */
.toggle{width:56px;height:32px;border-radius:99px;background:#DDE3ED;position:relative;flex:none;transition:background .22s}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .22s var(--ease)}
.toggle.on{background:var(--green)}
.toggle.on i{transform:translateX(24px)}

/* Avatar picker */
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.av-opt{
  aspect-ratio:1;border-radius:20px;background:#fff;box-shadow:var(--sh-1);
  display:grid;place-items:center;font-size:32px;border:3px solid transparent;
  transition:transform .14s var(--ease),border-color .18s;
}
.av-opt:active{transform:scale(.92)}
.av-opt.sel{border-color:var(--blue);background:var(--blue-soft)}

/* ---------- 10. BOTTOM NAV ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  max-width:480px;margin:0 auto;height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.97);backdrop-filter:blur(12px);
  border-top:1.5px solid var(--line);
  display:flex;align-items:stretch;
}
@media (min-width:760px){.tabbar{max-width:760px}}
@media (min-width:1024px){.tabbar{position:absolute;max-width:820px;border-radius:0 0 var(--r-xl) var(--r-xl)}}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11.5px;font-weight:800;position:relative;
  transition:color .18s;padding-top:6px;
}
.tab .ic{transition:transform .22s var(--ease)}
.tab.on{color:var(--blue)}
.tab.on .ic{transform:translateY(-3px)}
.tab.on::before{
  content:"";position:absolute;top:0;width:38px;height:4px;border-radius:0 0 6px 6px;background:var(--blue)
}
.tab:active .ic{transform:scale(.88)}
.tabbar.hidden{display:none}

/* ---------- 11. MODAL / SHEET ---------- */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(12,22,44,.5);
  opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:flex-end;justify-content:center;
}
.scrim.show{opacity:1;pointer-events:auto}
@media (min-width:1024px){.scrim{position:absolute;align-items:center}}
.sheet{
  width:100%;max-width:480px;background:#fff;border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:10px var(--pad) calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s var(--ease);
}
.scrim.show .sheet{transform:none}
@media (min-width:760px){.sheet{max-width:600px}}
@media (min-width:1024px){.sheet{border-radius:var(--r-xl);max-width:460px;margin:0 20px;transform:scale(.92)}}
.grabber{width:44px;height:5px;border-radius:99px;background:#DDE3ED;margin:6px auto 16px}
.sheet h3{font-size:22px;font-weight:900;text-align:center}
.sheet .sh-sub{text-align:center;color:var(--muted);font-weight:600;font-size:14.5px;margin-top:6px}
.sh-facts{background:#F6F8FC;border-radius:var(--r-md);padding:6px 16px;margin:18px 0}
.sh-facts div{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1.5px solid var(--line);font-size:15px}
.sh-facts div:last-child{border-bottom:0}
.sh-facts span{color:var(--muted);font-weight:700}
.sh-facts b{font-weight:800}

/* ---------- 12. MISC ---------- */
.hint-strip{
  display:flex;align-items:center;gap:11px;background:var(--blue-soft);
  border-radius:var(--r-md);padding:13px 15px;font-size:14px;font-weight:700;color:#22459C
}
.hint-strip.green{background:var(--green-soft);color:#0B7A44}
.hint-strip.amber{background:var(--amber-soft);color:#8A5E08}
.spacer{height:14px}
.hidden{display:none!important}
.center{text-align:center}
.muted{color:var(--muted);font-weight:600;font-size:14px}
.mascot{width:100%;max-width:220px;margin:0 auto;display:block}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

const topicsFor = (sid) => {
  const n = SUBJECTS.find(s=>s.id===sid).topics;
  const seed = sid.charCodeAt(0);
  return Array.from({length:n},(_,i)=>({
    id:`${sid}-t${i+1}`,
    name:`Topic ${i+1} · Placeholder`,
    pct:Math.max(0,Math.min(100,(seed*7 + i*23)%105 - 5)),
    done:((seed+i*13)%9)*5,
    total:45,
    offline:(seed+i)%3!==0
  }));
};

/* ============================================================
   NAVIGATION
   ============================================================ */
const TABS = [
  {id:'home',     label:'Home',     icon:'home'},
  {id:'practice', label:'Practice', icon:'practice'},
  {id:'papers',   label:'Papers',   icon:'papers'},
  {id:'profile',  label:'Profile',  icon:'profile'},
];
const TAB_OF = {home:'home',practice:'practice',subjects:'practice',topics:'practice',
  subjects_topics:'home',papers:'papers',paperDetail:'papers',progress:'home',profile:'profile',avatar:'profile',
  settings:'profile',offline:'profile',about:'profile'};
const FULLSCREEN = ['question','exam','results','review'];

function go(screen, push=true){
  if(push && state.screen!==screen) state.stack.push(state.screen);
  state.screen = screen;
  render();
  const v = document.getElementById('views');
  if(v) v.scrollTop = 0;
  window.scrollTo(0,0);
}
function back(){
  const prev = state.stack.pop() || 'home';
  state.screen = prev; render();
}
function tabTo(id){
  state.stack = [];
  state.tab = id;
  go(id, false);
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const views = document.getElementById('views');
  views.innerHTML = `<section class="screen active ${FULLSCREEN.includes(state.screen)?'no-nav':''}">${SCREENS[state.screen]()}</section>`;
  // tab bar
  const bar = document.getElementById('tabbar');
  const hide = FULLSCREEN.includes(state.screen);
  bar.classList.toggle('hidden', hide);
  const active = TAB_OF[state.screen];
  bar.innerHTML = TABS.map(t=>`
    <button class="tab ${t.id===active?'on':''}" onclick="tabTo('${t.id}')"
      aria-label="${t.label}" aria-current="${t.id===active?'page':'false'}">
      <span class="ic">${I[t.icon](25)}</span><span>${t.label}</span>
    </button>`).join('');
  hideFeedback();
}

function subjectsMarkup(title, sub){

/* ============================================================
   FLOW ACTIONS
   ============================================================ */
function pickMode(id){
  state.mode = id;
  if(id==='exam'){ go('papers'); state.tab='papers'; return; }
  go('subjects');
}
function pickSubject(id){
  state.subject = id;
  if(state.screen==='subjects_topics' || state.mode==='topic'){ go('topics'); return; }
  startSession(state.mode||'quick', id);
}
function openPaper(id){ state.paper=id; go('paperDetail'); }
function toggleOffline(id){
  state.offline[id] = !state.offline[id];
  render();
  toast(state.offline[id] ? 'Saved to your phone' : 'Removed from your phone');
}
function setAvatar(a){ state.avatar=a; render(); }
function toggle(k){ state[k]=!state[k]; render(); }

/* ---------- Practice session ---------- */
function startSession(mode, subject, topicId){
  const total = mode==='quick'?10:(mode==='mixed'?15:12);
  const tName = topicId ? `Topic ${topicId.split('t')[1]}` : 'Mixed topics';
  state.mode = mode; state.subject = subject; state.topic = topicId||null;
  state.session = {
    kind:'practice', mode, subject, total, i:0, correct:0,
    topicName:tName, picks:Array(total).fill(null), detail:[], t0:Date.now(), locked:false
  };
  go('question');
}
const rightFor = i => (i*3+1)%4;

function answer(idx){
  const s = state.session;
  if(s.locked) return;
  s.locked = true;
  const right = rightFor(s.i);
  const ok = idx===right;
  s.picks[s.i]=idx;
  s.detail.push({ok, pick:idx, right});
  if(ok) s.correct++;

  document.querySelectorAll('.ans').forEach(b=>{
    const i = +b.dataset.i;
    b.disabled = true;
    if(i===right){ b.classList.add('correct','bump'); }
    else if(i===idx){ b.classList.add('wrong','nudge'); b.querySelector('.mark').innerHTML = I.x(22); }
    else b.classList.add('dim');
  });

  showFeedback(ok);
  if(state.auto){
    clearTimeout(state.autoT);
    state.autoT = setTimeout(nextQuestion, ok?1400:2400);
  }
  // refresh the small correct-counter
  const pill = document.querySelector('.qbar .pill');
  if(pill) pill.innerHTML = `${I.check(13)} ${s.correct} correct`;
}

function nextQuestion(){
  clearTimeout(state.autoT);
  const s = state.session;
  hideFeedback();
  if(s.i >= s.total-1){ finish(); return; }
  s.i++; s.locked=false;
  render();
}

function showFeedback(ok){
  const f = document.getElementById('feedback');
  const good = ['Well done!','Correct!','Nice work!','You got it!'];
  const soft = ['Good effort!','Almost there!',"Let's learn this one.",'Try again next time!'];
  f.className = 'feedback show ' + (ok?'good':'soft');
  document.getElementById('fbIcon').textContent = ok?'🎉':'💡';
  document.getElementById('fbTitle').textContent = ok
    ? good[Math.floor(Math.random()*good.length)]
    : soft[Math.floor(Math.random()*soft.length)];
  document.getElementById('fbSub').textContent = ok
    ? 'That is the correct answer.'
    : 'The green one is the correct answer.';
}
function hideFeedback(){
  const f = document.getElementById('feedback');
  if(f) f.className='feedback';
}
document.getElementById('fbNext').onclick = () => {
  if(state.session && state.session.kind==='practice') nextQuestion();
};

function finish(){
  const s = state.session;
  const time = Math.max(5, Math.round((Date.now()-s.t0)/1000));
  state.lastResult = {
    correct:s.correct, total:s.total, pct:Math.round(s.correct/s.total*100),
    time, detail:s.detail, kind:s.kind
  };
  if(state.timerId){clearInterval(state.timerId);state.timerId=null;}
  go('results');
}
function repeatSession(){
  const r = state.lastResult;
  if(r.kind==='exam'){ startExam(state.paper); }
  else startSession(state.mode||'quick', state.subject||'math', state.topic);
}

/* ---------- Exam ---------- */
function confirmExam(){
  const p = PAPERS.find(x=>x.id===state.paper);
  const s = subjById(p.sub);
  openSheet(`
    <div class="grabber"></div>
    <div style="text-align:center">
      <span class="ic" style="width:70px;height:70px;border-radius:24px;display:grid;place-items:center;margin:0 auto;background:${cv(s.s)};color:${cv(s.c)}">${I.clock(34)}</span>
    </div>
    <h3 style="margin-top:14px">Ready to start?</h3>
    <div class="sh-sub">The timer starts when you tap the button.</div>
    <div class="sh-facts">
      <div><span>Subject</span><b>${s.name}</b></div>
      <div><span>Questions</span><b>${p.q}</b></div>
      <div><span>Time allowed</span><b>${Math.floor(p.mins/60)}h ${p.mins%60}m</b></div>
    </div>
    <button class="btn btn-green btn-lg" onclick="closeSheet();startExam('${p.id}')">${I.play(20)} START EXAM</button>
    <div style="height:11px"></div>
    <button class="btn btn-ghost" onclick="closeSheet()">Not yet</button>
  `);
}
function startExam(pid){
  const p = PAPERS.find(x=>x.id===pid);
  state.paper = pid; state.subject = p.sub;
  const total = 12; // shortened for the prototype walkthrough
  state.session = {
    kind:'exam', mode:'exam', subject:p.sub, total, i:0, correct:0,
    topicName:'Exam', picks:Array(total).fill(null), detail:[], t0:Date.now(),
    time: 10*60, locked:false
  };
  go('exam');
  startTimer();
}
function startTimer(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    const s = state.session;
    if(!s || s.kind!=='exam'){clearInterval(state.timerId);return;}
    s.time--;
    const el = document.getElementById('timer');
    if(el){
      el.innerHTML = `${I.clock(16)} ${fmtLong(s.time)}`;
      el.classList.toggle('warn', s.time<=60);
    }
    if(s.time<=0) submitExam();
  },1000);
}
function examPick(idx){
  const s = state.session;
  s.picks[s.i] = idx;
  document.querySelectorAll('.ans').forEach(b=>b.classList.toggle('picked', +b.dataset.i===idx));
  setTimeout(()=>{ if(s.i < s.total-1) examMove(1); }, 380);
}
function examMove(d){
  const s = state.session;
  const n = s.i + d;
  if(n<0 || n>=s.total) return;
  s.i = n; render();
}
function confirmSubmit(){
  const s = state.session;
  const answered = s.picks.filter(p=>p!==null).length;
  openSheet(`
    <div class="grabber"></div>
    <div style="text-align:center">${iconBox('flag','--blue','--blue-soft',30,66)}</div>
    <h3 style="margin-top:14px">Submit your exam?</h3>
    <div class="sh-sub">You answered ${answered} of ${s.total} questions.</div>
    <div style="height:18px"></div>
    <button class="btn btn-primary btn-lg" onclick="closeSheet();submitExam()">${I.check(20)} YES, SUBMIT</button>
    <div style="height:11px"></div>
    <button class="btn btn-ghost" onclick="closeSheet()">Keep answering</button>
  `);
}
function submitExam(){
  const s = state.session;
  s.detail = s.picks.map((p,i)=>({ok:p===rightFor(i), pick:p, right:rightFor(i)}));
  s.correct = s.detail.filter(d=>d.ok).length;
  finish();
}
function confirmQuit(){
  openSheet(`
    <div class="grabber"></div>
    <div style="text-align:center">${iconBox('hand','--amber','--amber-soft',30,66)}</div>
    <h3 style="margin-top:14px">Stop practising?</h3>
    <div class="sh-sub">Your progress so far is saved.</div>
    <div style="height:18px"></div>
    <button class="btn btn-primary btn-lg" onclick="closeSheet();tabTo('home')">${I.home(20)} YES, GO HOME</button>
    <div style="height:11px"></div>
    <button class="btn btn-ghost" onclick="closeSheet()">Keep practising</button>
  `);
}

/* ============================================================
   SHEET + TOAST
   ============================================================ */
function openSheet(html){
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('scrim').classList.add('show');
}
function closeSheet(){ document.getElementById('scrim').classList.remove('show'); }
document.getElementById('scrim').addEventListener('click', e=>{
  if(e.target.id==='scrim') closeSheet();
});
function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);
    background:#111F3A;color:#fff;padding:13px 20px;border-radius:99px;font-weight:800;font-size:15px;
    z-index:99;opacity:0;transition:.25s var(--ease);box-shadow:0 10px 24px rgba(0,0,0,.25)`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translate(-50%,0)'});
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translate(-50%,14px)';setTimeout(()=>t.remove(),300)},1700);
}

/* ============================================================
   ENTRY ANIMATIONS (bars, donut, score, confetti)
   ============================================================ */
const mo = new MutationObserver(()=>{
  // grow bars
  document.querySelectorAll('[data-grow]').forEach(el=>{
    const w = el.dataset.grow; delete el.dataset.grow;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=w}));
  });
  // donut
  const arc = document.getElementById('donutArc');
  if(arc && arc.dataset.off){
    const off = arc.dataset.off; delete arc.dataset.off;
    arc.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{arc.style.strokeDashoffset = off}));
  }
  // score count-up + confetti
  const sb = document.getElementById('scoreBig');
  if(sb && !sb.dataset.done){
    sb.dataset.done = '1';
    const target = state.lastResult.pct;
    let v = 0;
    const step = () => { v += Math.max(1, Math.round(target/26)); if(v>=target){v=target;} sb.textContent = v+'%'; if(v<target) requestAnimationFrame(step); };
    setTimeout(step, 220);
    if(state.sound) confetti();
  }
});
mo.observe(document.getElementById('views'), {childList:true, subtree:true});

function confetti(){
  const box = document.getElementById('confetti');
  if(!box) return;
  const colors = ['#FFD84D','#FF8FB1','#7C5CFF','#FFFFFF','#8CE0B4','#4C82FF'];
  for(let i=0;i<28;i++){
    const b = document.createElement('i');
    b.className = 'confetti-bit';
    b.style.left = Math.random()*100+'%';
    b.style.background = colors[i%colors.length];
    b.style.animationDuration = (1.5+Math.random()*1.2)+'s';
    b.style.animationDelay = (Math.random()*.5)+'s';
    box.appendChild(b);
    setTimeout(()=>b.remove(), 3200);
  }
}

/* ---------- keyboard nicety for desktop ---------- */
document.addEventListener('keydown', e=>{
  if(state.screen==='question'){
    const k = e.key.toUpperCase();
    if('ABCD'.includes(k)) answer('ABCD'.indexOf(k));
    if(e.key==='Enter') nextQuestion();
  }
  if(e.key==='Escape') closeSheet();
});

/* ---------- boot ---------- */
render();
</script>
</body>
